name: Verify CASPER
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the original Python stack
        run: python -m pip install -r requirements-test.txt
      - name: Test C++ engine and real survey pipeline
        run: python -m unittest discover -s tests -v
      - name: Generate desktop benchmark and figures
        run: python main.py --out results
      - name: Archive the five figures and machine-readable report
        uses: actions/upload-artifact@v4
        with:
          name: casper-desktop-benchmark
          path: results/
          if-no-files-found: error
